# Long-lived containers on a small host: cap each service's json-file log at
# 30 MB so a chatty week cannot fill the disk. `docker compose logs` is
# unaffected; ship logs elsewhere if you need history.
x-bounded-logs: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# A local `docker compose build` (the deploy host never builds) stamps the
# binaries with the commit for the source offer the interfaces make; the
# context carries no .git, so it has to be passed in, together with whether
# the tree matches it (an image built from edited files must not claim a
# clean commit):
#   JUDGE_COMMIT=$(git rev-parse HEAD) JUDGE_DIRTY=$(git diff-index --quiet HEAD || echo 1) \
#     docker compose up -d --build judgebot
# Blank builds an image whose offer says "commit unknown".
x-build: &build
  context: .
  args:
    JUDGE_COMMIT: ${JUDGE_COMMIT:-}
    JUDGE_DIRTY: ${JUDGE_DIRTY:-}

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: judgebot-db
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      POSTGRES_USER: judgebot
      POSTGRES_PASSWORD: judgebot
      POSTGRES_DB: judgebot
    # Loopback-only: nothing on the LAN reaches Postgres directly. DB_PORT in
    # .env moves the published port (and DATABASE_URL with it) when something
    # else on the host already has 5432.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - judgebot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judgebot"]
      interval: 5s
      timeout: 3s
      retries: 10

  judgebot:
    build: *build
    # The one image, named after the GHCR package so a low-powered host pulls
    # a CI-built image instead of building:
    # `docker compose pull && docker compose up -d --remove-orphans`.
    # JUDGE_IMAGE defaults to the upstream package; a fork whose CI publishes
    # its own sets it in .env. Pin JUDGE_IMAGE_TAG to a release version or a
    # `sha-<short>` tag to roll back (an image older than the judgebot binary
    # also needs the docker-compose.yml of its release); the image is amd64
    # and arm64; `build: .` still works locally.
    image: ${JUDGE_IMAGE:-ghcr.io/sloshy/mtg-judgebot}:${JUDGE_IMAGE_TAG:-latest}
    container_name: judgebot
    restart: unless-stopped
    logging: *bounded-logs
    # Named here, so the image's default entrypoint (judge-bot, kept for
    # compose files written before this service) is never what runs.
    entrypoint: ["judgebot"]
    # The roles: JUDGE_ROLES in .env when it is set, for example
    # `--api --web --jobs` without Discord or `--discord --jobs` without a
    # public page. Unset, every role but --mcp: what the `bot` and `api`
    # services ran together, with the interfaces from API_INTERFACES, the
    # deprecated variable those services read (the process logs a warning
    # naming the JUDGE_ROLES line that replaces it). Nested defaults were
    # checked against compose-go v1.16.0, the version Compose v2.20.0 pins. GET /api/health is served while any of --api,
    # --web and --mcp is on, so the healthcheck below holds for any of them.
    command: ${JUDGE_ROLES:---discord --jobs ${API_INTERFACES:---api --web}}
    env_file: .env
    environment:
      DATABASE_URL: postgres://judgebot:judgebot@db:5432/judgebot
      WEB_DIST: /srv/web
      INGEST_CACHE_DIR: /var/cache/judgebot
      RUST_LOG: info,sqlx=warn,serenity=warn
      # JUDGE_CONFIG in .env is a *host* path (./judge.toml, as `cargo run`
      # reads it). The file is bind-mounted below and the container is told the
      # path it sees it at; blank/unset means no file, and the loader builds
      # the Anthropic + Voyage setup from the keys in .env. The tracked example
      # is mounted in that case only so the mount has a source: the loader
      # reads nothing it was not pointed at.
      JUDGE_CONFIG: ${JUDGE_CONFIG:+/etc/judgebot/judge.toml}
    volumes:
      # The --jobs role runs the data refresh (JUDGE_REFRESH_HOURS) and shares
      # the download cache with `refresh`. A run holds a lock in the database,
      # so only one of them writes it at a time.
      - judgebot-ingest-cache:/var/cache/judgebot
      - type: bind
        source: ${JUDGE_CONFIG:-./judge.example.toml}
        target: /etc/judgebot/judge.toml
        read_only: true
    # `refresh` carries the same two stanzas: every binary resolves all three
    # stages of the file (the api_key_env of each provider a stage names must
    # be set in .env, including for `refresh`, which only embeds), and
    # `refresh`'s `embed` step writes the vector space judgebot queries, so
    # the two must agree. Editing the file's content changes nothing here,
    # so `up -d` will not recreate: `docker compose restart judgebot`.
    networks:
      default:
        # The HTTP roles were the `api` service, and a Cloudflare Tunnel set
        # up then sends its public hostname to http://api:8787. The alias
        # keeps that address working with no dashboard edit;
        # http://judgebot:8787 is the same listener.
        aliases: [api]
    # Loopback-only. Public traffic arrives through the cloudflared tunnel on
    # the compose network, never through a published port. This is also what
    # makes API_CLIENT_IP=cloudflare sound: CF-Connecting-IP is only
    # trustworthy while Cloudflare is the sole route to the origin.
    ports:
      - "127.0.0.1:8787:8787"
    # /api/health answers 503 until Postgres does. The slim image has no curl,
    # so this is bash's /dev/tcp — invoked as bash explicitly, because CMD-SHELL
    # would run /bin/sh, which is dash there and has no /dev/tcp. It probes
    # only when the process runs an HTTP role: the roles are read from its
    # command line (/proc/1/cmdline, NUL-separated: judgebot --discord ...),
    # or from JUDGE_ROLES when that names none. Without --api, --web or --mcp
    # (JUDGE_ROLES=--discord --jobs) nothing listens and the check passes, so
    # the container is not "unhealthy" forever and cloudflared, which waits for
    # it, still starts. The Discord gateway is not observable from outside the
    # process; a fatal disconnect exits it, which `restart: unless-stopped`
    # already covers. `$$` is a literal `$` to Compose.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          r=" $$(tr '\0' ' ' </proc/1/cmdline) ";
          case "$$r" in *" --"[a-z]*) ;; *) r=" $${JUDGE_ROLES:-} " ;; esac;
          case "$$r" in *" --api "*|*" --web "*|*" --mcp "*) ;; *) exit 0 ;; esac;
          exec 3<>/dev/tcp/127.0.0.1/8787 &&
          printf 'GET /api/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q ' 200 '
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  # `judgebot ingest` on demand: the first load (`docker compose run --rm
  # refresh init`), a refresh by hand or from an operator's own cron
  # (`scripts/refresh-data.sh`), and every other ingest command, with no Rust
  # on the host. Not a long-running service: judgebot's --jobs role refreshes
  # the data on its own schedule (JUDGE_REFRESH_HOURS), and a run started here
  # takes turns with it through the same lock in the database. `run` enables
  # the profile by itself, so `up -d` never starts it. Same image as judgebot;
  # the arguments after the service name replace `refresh`.
  refresh:
    build: *build
    image: ${JUDGE_IMAGE:-ghcr.io/sloshy/mtg-judgebot}:${JUDGE_IMAGE_TAG:-latest}
    profiles: ["refresh"]
    entrypoint: ["judgebot", "ingest"]
    command: ["refresh"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://judgebot:judgebot@db:5432/judgebot
      INGEST_CACHE_DIR: /var/cache/judgebot
      RUST_LOG: info,sqlx=warn
      JUDGE_CONFIG: ${JUDGE_CONFIG:+/etc/judgebot/judge.toml}
    volumes:
      # Scryfall's bulk files change daily so this rarely saves a download, but
      # a run that dies mid-way leaves nothing behind in the container layer.
      - judgebot-ingest-cache:/var/cache/judgebot
      - type: bind
        source: ${JUDGE_CONFIG:-./judge.example.toml}
        target: /etc/judgebot/judge.toml
        read_only: true
    depends_on:
      db:
        condition: service_healthy

  # judge-config, the config editor: a page on localhost for .env and
  # judge.toml (site: self-hosting/config-editor). Run `scripts/config.sh`,
  # which is `docker compose run --rm --service-ports` as your own user so the
  # files it saves stay yours. It reads the files it edits from the checkout
  # mounted at /work and has no env_file, so it runs before .env exists: the
  # first save creates .env from .env.example. A relative JUDGE_CONFIG resolves
  # inside the mount; an absolute one needs `scripts/config.sh --config ...`.
  config:
    build: *build
    image: ${JUDGE_IMAGE:-ghcr.io/sloshy/mtg-judgebot}:${JUDGE_IMAGE_TAG:-latest}
    profiles: ["config"]
    entrypoint: ["judge-config", "--listen", "0.0.0.0:8790"]
    environment:
      # Where the port below is published: what the editor prints, and why it
      # does not warn about listening on 0.0.0.0 inside the container.
      JUDGE_CONFIG_PUBLISHED: 127.0.0.1:8790
    working_dir: /work
    volumes:
      - .:/work
    ports:
      # Loopback only: the page edits your settings.
      - "127.0.0.1:8790:8790"

  # The weekly database backup to Cloudflare R2, with no host cron: `judgebot
  # backup serve` takes one whenever the newest in the bucket is
  # BACKUP_EVERY_DAYS old (default 7), checked hourly, so a restart does not
  # reset the schedule and a cron'd scripts/backup-db.sh run counts. Off by
  # default; deployments opt in with `backup` in COMPOSE_PROFILES in .env
  # (COMPOSE_PROFILES=tunnel,backup). Same image as judgebot, which carries a
  # pg_dump matched to `db` above (Dockerfile, PG_MAJOR); it reaches Postgres
  # over the compose network, so it needs no Docker socket.
  #
  # Its settings are .env.deploy's (R2_*, BACKUP_*, and JUDGE_ALERT_WEBHOOK
  # for its failure and recovery alerts) and DATABASE_URL below. It has no
  # env_file .env: the R2 keys can delete every backup, so they stay out of
  # the internet-facing judgebot, and this container needs nothing of .env's
  # (D15). The same service runs the restore drill's commands:
  #   docker compose run --rm --no-deps backup list
  #   docker compose run --rm --no-deps -T backup fetch judgebot-<stamp>.dump.gz > judgebot-<stamp>.dump.gz
  #   docker compose run --rm backup run       # one now, whatever the schedule
  # (--no-deps: listing and fetching need only the bucket, not a running db)
  # No healthcheck: what matters is the age of the newest backup, which is in
  # the bucket, and a failure is posted to the webhook rather than left in a
  # status nobody reads on an unattended host.
  backup:
    build: *build
    image: ${JUDGE_IMAGE:-ghcr.io/sloshy/mtg-judgebot}:${JUDGE_IMAGE_TAG:-latest}
    container_name: judgebot-backup
    restart: unless-stopped
    profiles: ["backup"]
    logging: *bounded-logs
    entrypoint: ["judgebot", "backup"]
    command: ["serve"]
    # Short form, as cloudflared's: Synology's Compose predates `required:`.
    # Only machines running the backup or tunnel profile need the file.
    env_file:
      - .env.deploy
    environment:
      DATABASE_URL: postgres://judgebot:judgebot@db:5432/judgebot
      RUST_LOG: info
      # .env.deploy also holds the tunnel's token, which is not this
      # container's business; `environment` overrides `env_file`.
      TUNNEL_TOKEN: ""
    depends_on:
      db:
        condition: service_healthy

  # Public entry point. Dials out to Cloudflare's edge, so the host needs no
  # open inbound port, no public IPv4 and no dynamic DNS. Off by default;
  # deployments opt in with COMPOSE_PROFILES=tunnel in .env.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    container_name: judgebot-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    # Deploy credentials live in their own file so they never enter the env of
    # judgebot, which is internet-facing and reads neither. Short-form
    # string on purpose: the `path:`/`required:` long form needs Compose 2.24+,
    # and Synology's Container Manager ships older than that. Only machines
    # running the tunnel profile need .env.deploy to exist.
    env_file:
      - .env.deploy
    # The backup's keys and settings share that file; the tunnel needs none
    # of them (it reads TUNNEL_TOKEN), so they are blanked here.
    environment:
      R2_BUCKET: ""
      R2_ENDPOINT: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      JUDGE_ALERT_WEBHOOK: ""
    logging: *bounded-logs
    depends_on:
      judgebot:
        condition: service_healthy

volumes:
  judgebot-pgdata:
  judgebot-ingest-cache:
