services:
  db:
    image: pgvector/pgvector:pg16
    container_name: judgebot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: judgebot
      POSTGRES_PASSWORD: judgebot
      POSTGRES_DB: judgebot
    # Loopback-only: nothing on the LAN reaches Postgres directly.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - judgebot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judgebot"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    # `bot` and `api` are one image, two entrypoints. Naming it after the GHCR
    # package lets a low-powered host pull a CI-built image instead of building:
    # `docker compose pull && docker compose up -d`. Pin JUDGE_IMAGE_TAG to a
    # `sha-<short>` tag in .env to roll back; `build: .` still works locally.
    image: ghcr.io/sloshy/mtg-judgebot:${JUDGE_IMAGE_TAG:-latest}
    container_name: judgebot-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://judgebot:judgebot@db:5432/judgebot
      RUST_LOG: info,sqlx=warn,serenity=warn
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    image: ghcr.io/sloshy/mtg-judgebot:${JUDGE_IMAGE_TAG:-latest}
    container_name: judgebot-api
    restart: unless-stopped
    entrypoint: ["judge-api"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://judgebot:judgebot@db:5432/judgebot
      WEB_DIST: /srv/web
      RUST_LOG: info,sqlx=warn
    # Loopback-only. Public traffic arrives through the cloudflared tunnel on
    # the compose network, never through a published port. This is also what
    # makes API_CLIENT_IP=cloudflare sound: CF-Connecting-IP is only
    # trustworthy while Cloudflare is the sole route to the origin.
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      db:
        condition: service_healthy

  # Public front door. Dials out to Cloudflare's edge, so the host needs no
  # open inbound port, no public IPv4 and no dynamic DNS. Off by default;
  # deployments opt in with COMPOSE_PROFILES=tunnel in .env.
  cloudflared:
    image: cloudflare/cloudflared:2026.8.3
    container_name: judgebot-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    # Deploy credentials live in their own file so they never enter the env of
    # `bot`/`api`, which are internet-facing and read neither. Short-form
    # string on purpose: the `path:`/`required:` long form needs Compose 2.24+,
    # and Synology's Container Manager ships older than that. Only machines
    # running the tunnel profile need .env.deploy to exist.
    env_file:
      - .env.deploy
    depends_on:
      - api

volumes:
  judgebot-pgdata:
