[package]
name = "judge-bot"
version = "1.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "sqlx repos, model adapters over judge-llm, the judge.toml loader and build_deps composition, serenity/poise Discord adapter, the ingest steps, the refresh schedule and the database backup (lib; the binary is judgebot)."

[lib]
name = "judge_bot"
path = "src/lib.rs"

[features]
# The Anthropic cloud endpoints (`endpoint = "claude-platform-on-aws" | "bedrock"`
# and `"vertex"` in judge.toml). Forwarded to judge-anthropic; a binary built
# without one refuses that endpoint at load, naming the feature.
default = ["aws", "gcp"]
aws = ["judge-anthropic/aws"]
gcp = ["judge-anthropic/gcp"]

[dependencies]
judge-core.workspace = true
judge-llm.workspace = true
judge-anthropic.workspace = true
judge-openai.workspace = true
judge-embed.workspace = true
anyhow.workspace = true
async-trait.workspace = true
nonempty.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio = { workspace = true, features = ["sync", "time", "process", "fs", "io-util", "io-std"] }
tracing.workspace = true
thiserror.workspace = true
uuid.workspace = true
nutype.workspace = true
# `stream`: `backup::s3` uploads a dump from its file rather than from memory.
reqwest = { workspace = true, features = ["stream"] }
toml.workspace = true
url.workspace = true
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
  "json",
  "macros",
  "migrate",
] }
pgvector = { version = "0.4", features = ["sqlx"] }
poise = "0.7"
serenity = { version = "0.12", default-features = false, features = [
  "builder",
  "client",
  "gateway",
  "rustls_backend",
  "model",
] }
# `ingest::renumber`: rule ids in running text.
regex = "1"
# `ingest::scryfall`: the bulk files are gzipped.
flate2 = "1"
# `ingest::aliases` / `ingest::notes`: the curated lists.
serde_yaml_ng = "0.10"
# `ingest::emoji`: Scryfall serves SVG, Discord takes raster only. No text in
# these symbols, so resvg's font machinery is left out.
resvg = { version = "0.48", default-features = false }
base64 = "0.23"
# `discord::pick::Digest`: ties a "did you mean?" button to its prompt;
# `backup`: the dump's payload hash, which the object store verifies.
sha2.workspace = true
# `backup::s3`: SigV4 for the S3 API (R2), the request signing the AWS SDK
# does, without the SDK. Already in the graph for the Anthropic AWS endpoints.
aws-sigv4.workspace = true
aws-credential-types.workspace = true
# `backup::s3`: the ListObjectsV2 and error bodies. Already in the graph
# (resvg's SVG parser).
roxmltree = "0.21"
# `backup::name`: the UTC stamp in a backup's object name.
time = "0.3"
# `backup::settings`: the user and password in DATABASE_URL, handed to pg_dump.
percent-encoding = "2"

[dev-dependencies]
wiremock.workspace = true

[lints]
workspace = true
