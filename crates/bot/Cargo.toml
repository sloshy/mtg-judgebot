[package]
name = "judge-bot"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "sqlx repos, Voyage embedder, serenity/poise Discord adapter, main (bin)."

[[bin]]
name = "bot"
path = "src/main.rs"

[dependencies]
judge-core.workspace = true
judge-anthropic.workspace = true
anyhow.workspace = true
async-trait.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json", "macros", "migrate"] }
pgvector = { version = "0.4", features = ["sqlx"] }
poise = "0.6"
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model"] }

[lints]
workspace = true
