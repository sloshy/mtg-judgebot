[package]
name = "judge-bot"
version = "1.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "sqlx repos, model adapters over judge-llm, the judge.toml loader and build_deps composition, serenity/poise Discord adapter, the ingest steps and the refresh schedule (lib; the binary is judgebot)."

[lib]
name = "judge_bot"
path = "src/lib.rs"

[features]
# The Anthropic cloud endpoints (`endpoint = "claude-platform-on-aws" | "bedrock"`
# and `"vertex"` in judge.toml). Forwarded to judge-anthropic; a binary built
# without one refuses that endpoint at load, naming the feature.
default = ["aws", "gcp"]
aws = ["judge-anthropic/aws"]
gcp = ["judge-anthropic/gcp"]

[dependencies]
judge-core.workspace = true
judge-llm.workspace = true
judge-anthropic.workspace = true
judge-openai.workspace = true
judge-embed.workspace = true
anyhow.workspace = true
async-trait.workspace = true
nonempty.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
thiserror.workspace = true
uuid.workspace = true
nutype.workspace = true
reqwest.workspace = true
toml.workspace = true
url.workspace = true
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
  "json",
  "macros",
  "migrate",
] }
pgvector = { version = "0.4", features = ["sqlx"] }
poise = "0.7"
serenity = { version = "0.12", default-features = false, features = [
  "builder",
  "client",
  "gateway",
  "rustls_backend",
  "model",
] }
# `ingest::renumber`: rule ids in running text.
regex = "1"
# `ingest::scryfall`: the bulk files are gzipped.
flate2 = "1"
# `ingest::aliases` / `ingest::notes`: the curated lists.
serde_yaml_ng = "0.10"
# `ingest::emoji`: Scryfall serves SVG, Discord takes raster only. No text in
# these symbols, so resvg's font machinery is left out.
resvg = { version = "0.48", default-features = false }
base64 = "0.23"

[dev-dependencies]
wiremock.workspace = true
sha2.workspace = true

[lints]
workspace = true
