[package]
name = "judge-bot"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "sqlx repos, model adapters over judge-llm, the judge.toml loader and build_deps composition, serenity/poise Discord adapter, main (bin)."

[lib]
name = "judge_bot"
path = "src/lib.rs"

[[bin]]
name = "bot"
path = "src/main.rs"

[features]
# The Anthropic cloud doors (`endpoint = "claude-platform-on-aws" | "bedrock"`
# and `"vertex"` in judge.toml). Forwarded to judge-anthropic; a binary built
# without one refuses that endpoint at load, naming the feature.
default = ["aws", "gcp"]
aws = ["judge-anthropic/aws"]
gcp = ["judge-anthropic/gcp"]

[dependencies]
judge-core.workspace = true
judge-llm.workspace = true
judge-anthropic.workspace = true
judge-openai.workspace = true
judge-embed.workspace = true
anyhow.workspace = true
async-trait.workspace = true
nonempty.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
uuid.workspace = true
nutype.workspace = true
toml.workspace = true
url.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json", "macros", "migrate"] }
pgvector = { version = "0.4", features = ["sqlx"] }
poise = "0.6"
serenity = { version = "0.12", default-features = false, features = ["builder", "client", "gateway", "rustls_backend", "model"] }
dotenvy = "0.15"

[dev-dependencies]
wiremock.workspace = true
sha2.workspace = true

[lints]
workspace = true
