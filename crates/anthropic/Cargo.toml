[package]
name = "judge-anthropic"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The Anthropic Messages API as a judge-llm backend: wire types, schema transform, request/response conversion, endpoints."

[dependencies]
judge-core.workspace = true
judge-llm.workspace = true
async-trait.workspace = true
reqwest.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
aws-config = { workspace = true, optional = true }
aws-sigv4 = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }
gcp_auth = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync"], optional = true }

[features]
default = ["aws", "gcp"]
aws = ["dep:aws-config", "dep:aws-sigv4", "dep:aws-credential-types", "dep:tokio"]
gcp = ["dep:gcp_auth", "dep:tokio"]

[dev-dependencies]
wiremock.workspace = true
tokio.workspace = true

[lints]
workspace = true
