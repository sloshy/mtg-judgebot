[package]
name = "judge-eval"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Offline evaluation against eval/gold.yaml (retrieval recall gate, ARCHITECTURE.md §6 step 4)."

[[bin]]
name = "eval"
path = "src/main.rs"

[dependencies]
judge-core.workspace = true
judge-bot.workspace = true
judge-llm.workspace = true
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
] }
dotenvy = "0.15"

[dev-dependencies]
uuid.workspace = true

[lints]
workspace = true
