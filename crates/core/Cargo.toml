[package]
name = "judge-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Domain types, ports, judge() and citation validation. No I/O dependencies."

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
futures.workspace = true
nonempty.workspace = true
nutype.workspace = true
regex = "1"
# Release versions: which client and instance releases work together (`release`).
semver = "1"
schemars.workspace = true
serde.workspace = true
# Pure hashing: `ruling_key` is the one definition of a ruling's identity, shared
# by the ingest writer and every reader.
sha2.workspace = true
# A data format, not I/O: `Citations` parses the model's citation array one
# element at a time, which needs an owned intermediate value.
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[features]
# The stub locale (`locale::STUB_ID`) as a `Locale` variant, so tests can
# negotiate it and render every catalog in it. Only `[dev-dependencies]` turn it
# on: no build that ships can choose it (D35, `scripts/check.sh lint` checks).
stub-locale = []

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"

[lints]
workspace = true
