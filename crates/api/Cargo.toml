[package]
name = "judge-api"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Anonymous HTTP adapter: axum routes over judge(), serving the SolidJS web client; the MCP transport at /mcp behind a token."

[lib]
name = "judge_api"
path = "src/lib.rs"

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
nonempty.workspace = true
judge-core.workspace = true
judge-llm.workspace = true
judge-bot.workspace = true
judge-agent.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "net"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
axum = "0.8"
tower-http = { version = "0.7", features = ["fs"] }
tower-service = "0.3"
subtle = "2"
dotenvy = "0.15"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
