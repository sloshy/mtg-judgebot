[package]
name = "judge-configure"
version = "1.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "judge-config: a local web page for editing judge.toml and .env, checked by the binaries' own loaders."

[lib]
name = "judge_configure"
path = "src/lib.rs"

[[bin]]
name = "judge-config"
path = "src/main.rs"

[dependencies]
judge-core.workspace = true
judge-bot.workspace = true
judge-api = { path = "../api" }
anyhow.workspace = true
nonempty.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
dotenvy = "0.15"
sha2.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["net", "signal", "sync"] }
axum = "0.8"
url.workspace = true
toml_edit = "0.25.15"

[lints]
workspace = true
