<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>judge-config</title>
    <link rel="stylesheet" href="app.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="top">
      <h1>judge-config</h1>
      <p id="paths" class="muted"></p>
    </header>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="models" aria-selected="true" data-msg="tabModels"></button>
      <button type="button" role="tab" data-tab="settings" aria-selected="false" data-msg="tabSettings"></button>
      <button type="button" role="tab" data-tab="review" aria-selected="false"><span data-msg="tabReview"></span> <span id="pending" class="count"></span></button>
    </div>
    <div class="layout">
      <main>
        <section id="tab-models" class="tab"></section>
        <section id="tab-settings" class="tab" hidden></section>
        <section id="tab-review" class="tab" hidden></section>
      </main>
      <aside id="checks" aria-live="polite">
        <ul id="check-list"></ul>
        <ul id="warnings"></ul>
        <ul class="points muted small">
          <li data-msg="checkedBy"></li>
          <li data-msg="leftToStartup"></li>
        </ul>
      </aside>
    </div>
    <p id="fatal" class="fatal" hidden></p>
  </body>
</html>
