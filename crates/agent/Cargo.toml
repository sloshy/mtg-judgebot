[package]
name = "judge-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The judge for other agents: one tool surface (sessions, lookups, the full pipeline) as an MCP server and as judge-cli."

[lib]
name = "judge_agent"
path = "src/lib.rs"

[[bin]]
name = "judge-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "judge-mcp"
path = "src/bin/mcp.rs"

[dependencies]
judge-core.workspace = true
judge-llm.workspace = true
judge-embed.workspace = true
judge-bot.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio = { workspace = true, features = ["sync", "io-std", "time", "macros"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
rmcp.workspace = true
dotenvy = "0.15"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "migrate"] }

[dev-dependencies]
nonempty.workspace = true
uuid.workspace = true

[lints]
workspace = true
