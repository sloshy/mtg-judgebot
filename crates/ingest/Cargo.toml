[package]
name = "judge-ingest"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Scryfall sync, CR parser, embedding (bin)."

[[bin]]
name = "ingest"
path = "src/main.rs"

[dependencies]
judge-core.workspace = true
judge-embed.workspace = true
anyhow.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json", "macros", "migrate", "chrono"] }
pgvector = { version = "0.4", features = ["sqlx"] }
dotenvy = "0.15"
flate2 = "1"
serde_yaml_ng = "0.10"

[lints]
workspace = true
