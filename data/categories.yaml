# Single source of truth for the question taxonomy.
# `crates/core/build.rs` generates `judge_core::Category` from this file.
# id: stable snake_case identifier (becomes the enum variant and the serde name)
# label: human-readable name
# subsections: CR sections/subsections that are always injected into Context
categories:
  - id: game_concepts
    label: General game concepts (winning, losing, mana, numbers)
    subsections: ["100", "101", "104", "106", "107"]
  - id: card_types_and_characteristics
    label: Card characteristics, names, types, supertypes, subtypes
    subsections: ["201", "202", "204", "205", "208"]
  - id: colors_and_color_identity
    label: Colors, colorless, color indicator, color identity
    subsections: ["105", "202", "903.4"]
  - id: zones
    label: Zones (library, hand, battlefield, graveyard, exile, command, stack)
    subsections: ["400", "401", "403", "404", "405", "406", "408"]
  - id: turn_structure
    label: Turn structure, phases and steps
    subsections: ["500", "501", "502", "503", "504", "505", "506", "507", "508", "509", "510", "511", "512", "513", "514"]
  - id: combat
    label: "Combat: attacking, blocking, damage assignment"
