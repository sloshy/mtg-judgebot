# Hand-written notes for "nightmare" cards (ARCHITECTURE.md §3 step 3 / §4 `card_notes`).
# Loaded by `ingest notes [data/notes.yaml]` (no file = the copy compiled into the binary). Flat mapping: `Card Name: note` (markdown).
# Names must be a current or printed name that identifies exactly one card. Notes are
# injected into Context whenever the card resolves; they are hints, the CR still governs.
Blood Moon: |
  Type-changing effect in layer 4 (613.1d). Setting a nonbasic land's subtype to Mountain
  removes its other land types and every ability from its rules text (305.7); it keeps
  only "{T}: Add {R}" and stays nonbasic (305.8). Abilities granted by other effects
  (e.g. Urborg's) are lost too when the granting source is itself a nonbasic land that
  Blood Moon has stripped: Urborg no longer has the ability that grants Swamp to
  everything, and Blood Moon does not depend on Urborg (613.8), so timestamps do not
  matter. Lands that entered tapped or with counters keep that state.
Urborg, Tomb of Yawgmoth: |
  Its ability adds the Swamp subtype without removing other types (305.7 applies only when
  an effect *sets* a basic land type; "in addition to its other types" means it adds).
  Under Blood Moon, Urborg is a Mountain with no abilities (305.7), so nothing is a Swamp
  regardless of timestamps: Blood Moon's effect removes the ability that would create the
  Urborg effect (613.8 dependency). Under Magus of the Moon the same applies.
Humility: |
  Layer 6 (ability-removing) then layer 7b (set P/T to 1/1). Interactions with other
  layer-7 effects are ordered by timestamp within the same sublayer, but sublayers are
  fixed: 7b (setting) before 7c (modifying, counters) before 7d (switching) (613.4).
  So a +1/+1 counter still applies on top of Humility's 1/1. Humility removes abilities
  from creatures only; it does not affect noncreature permanents' abilities, and any
  ability that turns a noncreature permanent into a creature (Opalescence) is on the
  noncreature side and keeps working.
Opalescence: |
  Makes other non-Aura enchantments creatures with P/T equal to their mana value (layer 4
  type change and layer 7b P/T setting). With Humility on the battlefield: Opalescence
  turns Humility into a creature, so Humility loses its own abilities (layer 6) — but
  Humility's ability still applies because the effect that removes it is generated by
  Humility itself; the classic result is decided by dependency (613.8) and timestamps
  (613.7): Opalescence's layer-4 effect depends on nothing; in layer 6 Humility removes
  abilities; in layer 7b both set P/T and the later timestamp wins. Cite 613.7/613.8 and
  walk the layers explicitly rather than quoting the folklore outcome.
Mycosynth Lattice: |
  Layer 4: all permanents become artifacts in addition to their other types; players can
  spend mana as though it were mana of any color; cards not on the battlefield are
  colorless. It does not change mana costs, just what mana may pay them. With March of the
  Machines, all noncreature artifacts (including lands) become creatures with P/T equal to
  their mana value — 0/0 lands die to state-based actions (704.5f).
Panglacial Wurm: |
  It may be cast while searching your library (mana abilities may be activated then, and
  the search is paused mid-resolution). The relevant rule is the one that lets a player
  cast it while an effect is searching their library; casting it is normally illegal in
  the middle of resolving a spell, so it is an exception only for this card. Mana abilities
  may be activated during the search to pay for it, but no other spells or abilities can
  be cast/activated, and it goes on the stack above the searching spell or ability, which
  finishes resolving first.
Lion's Eye Diamond: |
  Current Oracle text: "Sacrifice this artifact, Discard your hand: Add three mana of any
  one color. Activate only as an instant." Old printings say "play this ability as an
  interrupt"; use the Oracle text (108.1). It is a mana ability (605.1) but the "only as
  an instant" restriction means it cannot be activated while casting a spell or paying a
  cost (602.5e), only when you have priority. The Storm line is: cast the spell, hold
  priority, then activate LED in response.
