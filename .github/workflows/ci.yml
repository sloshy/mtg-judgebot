name: CI

# The gates CLAUDE.md and CONTRIBUTING.md name, enforced: formatting, a
# warning-free clippy over every target, the offline sqlx build, the committed
# .sqlx data in sync with the SQL, the whole test suite against a pgvector
# Postgres, the web page's and the docs site's lint, type-check and build, the
# docs' internal links, and the repository lints (dependency policy, unused
# dependencies, TOML format, spelling, shell, workflows, Dockerfile). Runs on every pull
# request; publish-image.yml calls it before it builds, so an image is never
# published from a tree that fails here.

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# No RUSTFLAGS=-D warnings: scripts/check.sh denies warnings through clippy's
# arguments instead, which is what the hooks run locally without changing the
# fingerprint of every crate.
env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, sqlx, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgres://judgebot:judgebot@localhost:5432/judgebot
      # At job level because a step's `if` cannot read its own `env`.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      # The database is started here and not as a `services:` container,
      # because a service is pulled before any step can log in, and Docker Hub
      # counts anonymous pulls per IP (the hosted runners share theirs).
      # A pull request from a fork has no secrets, so the login is skipped
      # there and the pull stays anonymous.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The migrations create the `vector` and `pg_trgm` extensions, so this
      # must be the pgvector image, not stock postgres. #[sqlx::test] creates a
      # throwaway database per test off DATABASE_URL.
      - name: Start Postgres with pgvector
        run: |
          for attempt in 1 2 3; do
            docker pull pgvector/pgvector:pg16 && break
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 15))
          done
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=judgebot -e POSTGRES_PASSWORD=judgebot -e POSTGRES_DB=judgebot \
            --health-cmd "pg_isready -U judgebot" --health-interval 5s \
            --health-timeout 5s --health-retries 20 \
            pgvector/pgvector:pg16
          for _ in $(seq 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' postgres)" = healthy ] && exit 0
            sleep 3
          done
          docker logs postgres
          exit 1

      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the version; the action installs exactly that.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # sqlx-cli has no prebuilt release, so it is compiled once and cached by
      # version.
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: sqlx-cli@0.9
          locked: true
          no-default-features: true
          features: postgres,rustls

      - uses: actions/cache@v6
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/tools.sh') }}

      # The same script the git hooks run: rustfmt, clippy on every target with
      # warnings denied (offline sqlx), migrations then `cargo sqlx prepare
      # --check` (the committed .sqlx metadata matches the live schema), and
      # the test suite.
      - run: scripts/check.sh rust sqlx test

  web:
    name: Web page (biome, tsc, vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      # scripts/check.sh is what the git hooks run, so a push that passed them
      # passes here. Its linters are the versions pinned in scripts/tools.sh.
      - uses: actions/cache@v6
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/tools.sh') }}
      # Biome (biome.json at the root), then tsc + vite build.
      - run: scripts/check.sh web

  docs:
    name: Docs site (biome, astro check, build, links)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm --prefix site ci
      - uses: actions/cache@v6
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/tools.sh') }}
      # Biome; astro check for the .astro files Biome skips; the build; lychee
      # over every internal link and #fragment in the built pages.
      - run: scripts/check.sh site

  lint:
    name: Lint (deps, TOML, spelling, shell, workflows, Dockerfile, icons)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # cargo deny and cargo machete read `cargo metadata`; installed here
      # rather than left to rustup's auto-install from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
      - uses: actions/cache@v6
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/tools.sh') }}
      # cargo deny (deny.toml), cargo machete, taplo, typos, shellcheck,
      # actionlint, hadolint, the icon's copies. The compose job below parses
      # the compose file.
      - run: scripts/check.sh lint

  compose:
    name: Compose file parses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # docker-compose.yml reads .env through env_file; the example stands in.
      - run: cp .env.example .env && docker compose config --quiet
