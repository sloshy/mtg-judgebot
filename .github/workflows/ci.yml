name: CI

# The gates CLAUDE.md and CONTRIBUTING.md name, enforced: formatting, a
# warning-free clippy over every target, the offline sqlx build, the committed
# .sqlx data in sync with the SQL, the whole test suite against a pgvector
# Postgres, the web page's and the docs site's lint, type-check and build, the
# docs' internal links, and the repository lints (dependency policy, unused
# dependencies, TOML format, spelling, shell, workflows, Dockerfile). Runs on every pull
# request; publish-image.yml calls it before it builds, so an image is never
# published from a tree that fails here.

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, sqlx, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      # The migrations create the `vector` and `pg_trgm` extensions, so this
      # must be the pgvector image, not stock postgres. #[sqlx::test] creates a
      # throwaway database per test off DATABASE_URL.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: judgebot
          POSTGRES_PASSWORD: judgebot
          POSTGRES_DB: judgebot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U judgebot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://judgebot:judgebot@localhost:5432/judgebot
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the version; the action installs exactly that.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy (offline sqlx, every target)
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy --workspace --all-targets

      # sqlx-cli has no prebuilt release, so it is compiled once and cached by
      # version. Its own warnings are not ours to fail on.
      - uses: taiki-e/cache-cargo-install-action@v2
        env:
          RUSTFLAGS: ""
        with:
          tool: sqlx-cli@0.9
          locked: true
          no-default-features: true
          features: postgres,rustls

      - name: apply migrations
        run: sqlx migrate run --source crates/bot/migrations

      # `cargo sqlx prepare --check` fails when a query's committed metadata
      # under .sqlx differs from what the live schema produces, i.e. when
      # someone changed SQL without running
      # `cargo sqlx prepare --workspace -- --all-targets`.
      - name: .sqlx is in sync
        run: cargo sqlx prepare --check --workspace -- --all-targets

      - name: tests
        run: cargo test --workspace

  web:
    name: Web page (tsc, vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      # Biome (biome.json at the root): format, lint, import order.
      - run: npm --prefix web run lint
      - run: npm --prefix web run build

  docs:
    name: Docs site (biome, astro check, build, links)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm --prefix site ci
      - run: npm --prefix site run lint
      # Type-checks the .astro components and content config, which Biome skips.
      - run: npm --prefix site run check
      - run: npm --prefix site run build
      # Every internal link and #fragment in the built pages, resolved on disk.
      # The pages link to /mtg-judgebot/…, so the root holds dist under that name.
      - name: prepare link root
        run: mkdir -p "$RUNNER_TEMP/site-root" && ln -s "$PWD/site/dist" "$RUNNER_TEMP/site-root/mtg-judgebot"
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --offline --include-fragments --index-files index.html
            --root-dir ${{ runner.temp }}/site-root
            'site/dist/**/*.html'
          fail: true

  lint:
    name: Lint (deps, TOML, spelling, shell, workflows, Dockerfile)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # cargo deny and cargo machete read `cargo metadata`; installed here
      # rather than left to rustup's auto-install from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2,taplo@0.10.0,typos@1.50.2
      # Advisories, licences and sources, per deny.toml.
      - run: cargo deny check
      - run: cargo machete
      - run: taplo fmt --check
      - run: typos
      # ubuntu-latest ships shellcheck; actionlint uses it for `run:` blocks too.
      - run: shellcheck scripts/*.sh
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

  compose:
    name: Compose file parses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # docker-compose.yml reads .env through env_file; the example stands in.
      - run: cp .env.example .env && docker compose config --quiet
