# Weekly dependency PRs, grouped so a routine week is one PR per ecosystem
# rather than twenty. CI (ci.yml) runs on each, so a breaking bump fails
# visibly instead of reaching the image.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /site
    schedule: { interval: weekly }
    groups:
      site-dependencies:
        patterns: ["*"]
    ignore:
      # @astrojs/check peers typescript ^5 || ^6, so 7 fails `npm ci` (ERESOLVE).
      # Drop this when @astrojs/check accepts 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
