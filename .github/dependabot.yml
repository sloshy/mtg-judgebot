# Weekly dependency PRs, grouped so a routine week is one PR per ecosystem
# rather than twenty. CI (ci.yml) runs on each, so a breaking bump fails
# visibly instead of reaching the image.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /site
    schedule: { interval: weekly }
    groups:
      site-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
