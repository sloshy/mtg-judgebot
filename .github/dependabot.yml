# Weekly dependency PRs, grouped so a routine week is one PR per ecosystem
# rather than twenty. CI (ci.yml) runs on each, so a breaking bump fails
# visibly instead of reaching the image.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /site
    schedule: { interval: weekly }
    groups:
      site-dependencies:
        patterns: ["*"]
    # package.json overrides postcss-nested@6's postcss-selector-parser with
    # ^7.1.6 (GHSA-rj75-hqrm-r3gf has no 6.x fix; postcss-nested 6.2.0, reached
    # through @expressive-code/core, asks ^6.1.1). The built CSS is unchanged.
    # Drop the override when @expressive-code/core depends on postcss-nested 7+.
    ignore:
      # @astrojs/check peers typescript ^5 || ^6, so 7 fails `npm ci` (ERESOLVE).
      # Drop this when @astrojs/check accepts 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  # The Dockerfile's base images. A rust or node bump here must also change
  # the copies `check.sh lint` holds equal to it (check_toolchains): edit them
  # on the PR's branch before merging.
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  # docker-compose.yml's third-party images: caddy, cloudflared and the db
  # (pgvector/pgvector:<release>-pg16-bookworm@<digest>). Dependabot moves a
  # tag only to one with the same suffix, so the db's PRs stay on Postgres 16
  # and bookworm; a major is a dump and restore, by hand (docs/DEPLOYMENT.md §8,
  # Database image). A merged db PR takes `scripts/deploy.sh --db` on the host.
  # The judgebot image is a variable and is skipped.
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
