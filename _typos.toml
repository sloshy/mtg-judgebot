# Spell check (`typos`), run in CI over the tracked tree.

[files]
extend-exclude = [".sqlx/", "Cargo.lock", "**/package-lock.json"]

[default]
# Text misspelled on purpose, matched as the exact strings it appears in so the
# same letters are still caught anywhere else: test inputs for the fuzzy card
# matcher, the config loader's unknown-key error and the MCP token compare,
# Spanish test text, and a Unicode class name.
extend-ignore-re = [
  '"Blak Lotus"', # crates/core/src/error.rs
  '"lood"',       # crates/core/src/judge.rs
  'api_key_evn',  # crates/bot/src/config.rs
  'b"abd"',       # crates/api/src/mcp.rs
  '¿Qué hace',    # crates/bot/src/discord/question.rs
  '`Nd` digit',   # crates/core/src/domain.rs
]

[default.extend-words]
# Both spellings are standard; the code uses this one.
unparseable = "unparseable"
