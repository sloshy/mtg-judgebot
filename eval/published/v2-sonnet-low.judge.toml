# Opus 5.5 extracting at medium, Claude Sonnet 5.5 answering at low effort: about 44%
# cheaper than the default, with an occasional answer right only in part.
# Run files: eval/published/v2-sonnet-low-r1.json and -r2.json (eval/sweeps/tiers.toml).
[models.embed]
model = "voyage-3.5"
provider = "voyage"

[models.extract]
effort = "medium"
model = "claude-opus-5-5"
provider = "anthropic"

[models.synth]
effort = "low"
model = "claude-sonnet-5-5"
provider = "anthropic"

[providers.anthropic]
api_key_env = "ANTHROPIC_API_KEY"
endpoint = "direct"
kind = "anthropic"

[providers.voyage]
kind = "voyage"
