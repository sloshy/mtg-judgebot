# The Sonnet configuration: Claude Sonnet 5.5 on both stages. The built-in price
# table knows claude-sonnet-5-5, so the spend cap meters it at Anthropic's
# first-party list price, cache reads included.
[providers.anthropic]
kind = "anthropic"
endpoint = "direct"
api_key_env = "ANTHROPIC_API_KEY"

[providers.voyage]
kind = "voyage"

[models.extract]
provider = "anthropic"
model = "claude-sonnet-5-5"

[models.synth]
provider = "anthropic"
model = "claude-sonnet-5-5"
effort = "high"

[models.embed]
provider = "voyage"
model = "voyage-3.5"
