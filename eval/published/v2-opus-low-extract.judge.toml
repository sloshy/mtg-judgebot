# The default with extraction at low effort: about 3% cheaper, and an occasional
# "did you mean?" when the extractor writes part of a card name alone.
# Run files: eval/published/v2-opus-low-extract-r1.json and -r2.json (eval/sweeps/tiers.toml).
[models.embed]
model = "voyage-3.5"
provider = "voyage"

[models.extract]
effort = "low"
model = "claude-opus-5-5"
provider = "anthropic"

[models.synth]
effort = "medium"
model = "claude-opus-5-5"
provider = "anthropic"

[providers.anthropic]
api_key_env = "ANTHROPIC_API_KEY"
endpoint = "direct"
kind = "anthropic"

[providers.voyage]
kind = "voyage"
