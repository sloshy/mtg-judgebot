# The Haiku configuration: Claude Haiku 5.5 on both stages, synthesis at
# medium effort (its measured default, named here so the file says so). The
# built-in price table knows claude-haiku-5-5, both of its rate cards (the
# dearer one for a prompt over 100K tokens), so the spend cap meters it at
# Anthropic's first-party list price, cache reads included.
[providers.anthropic]
kind = "anthropic"
endpoint = "direct"
api_key_env = "ANTHROPIC_API_KEY"

[providers.voyage]
kind = "voyage"

[models.extract]
provider = "anthropic"
model = "claude-haiku-5-5"

[models.synth]
provider = "anthropic"
model = "claude-haiku-5-5"
effort = "medium"

[models.embed]
provider = "voyage"
model = "voyage-3.5"
