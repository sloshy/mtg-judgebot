[workspace]
resolver = "3"
members = ["crates/core", "crates/llm", "crates/anthropic", "crates/openai", "crates/embed", "crates/ingest", "crates/bot", "crates/eval", "crates/api", "crates/agent"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
wiremock = "0.6"
judge-core = { path = "crates/core" }
judge-llm = { path = "crates/llm" }
# Its cloud doors are features; judge-bot turns them on (both by default).
judge-anthropic = { path = "crates/anthropic", default-features = false }
judge-openai = { path = "crates/openai" }
judge-embed = { path = "crates/embed" }
judge-bot = { path = "crates/bot" }
judge-agent = { path = "crates/agent" }

anyhow = "1"
async-trait = "0.1"
futures = "0.3"
nonempty = { version = "0.12", features = ["serialize"] }
nutype = { version = "0.7", features = ["serde", "regex"] }
sha2 = "0.10"
schemars = { version = "1.2", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
uuid = { version = "1", features = ["serde", "v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "3.2", default-features = false, features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
# Cloud doors for the Anthropic backend (optional features of judge-anthropic).
aws-config = "1"
aws-sigv4 = "1"
aws-credential-types = "1"
gcp_auth = "0.12"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "warn"
dbg_macro = "warn"
# JudgeError carries NonEmpty<Ambiguous>; boxing it buys nothing at this scale.
result_large_err = "allow"
# Counts physical lines, so rustfmt's line breaking decides it; the functions
# it flags are a CLI dispatcher, a loader and a few table-driven tests.
too_many_lines = "allow"
