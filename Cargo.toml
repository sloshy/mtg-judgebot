[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/llm",
  "crates/anthropic",
  "crates/openai",
  "crates/embed",
  "crates/bot",
  "crates/eval",
  "crates/api",
  "crates/agent",
  "crates/configure",
  "crates/judgebot",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
repository = "https://github.com/sloshy/mtg-judgebot"
publish = false

[workspace.dependencies]
wiremock = "0.6"
judge-core = { path = "crates/core" }
judge-llm = { path = "crates/llm" }
# Its cloud endpoints are features; judge-bot turns them on (both by default).
judge-anthropic = { path = "crates/anthropic", default-features = false }
judge-openai = { path = "crates/openai" }
judge-embed = { path = "crates/embed" }
judge-bot = { path = "crates/bot" }
judge-api = { path = "crates/api" }
judge-agent = { path = "crates/agent" }
judgebot = { path = "crates/judgebot" }

anyhow = "1"
async-trait = "0.1"
futures = "0.3"
nonempty = { version = "0.12", features = ["serialize"] }
nutype = { version = "0.8", features = ["serde", "regex"] }
sha2 = "0.11"
schemars = { version = "1.2", features = ["uuid1", "preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
uuid = { version = "1", features = ["serde", "v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "3.4", default-features = false, features = [
  "server",
  "macros",
  "schemars",
  "transport-io",
  "transport-streamable-http-server",
] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
url = "2"
# Cloud endpoints for the Anthropic backend (optional features of judge-anthropic).
aws-config = "1"
aws-sigv4 = "1"
aws-credential-types = "1"
gcp_auth = "0.12"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "warn"
dbg_macro = "warn"
# Every suppression is `#[expect(lint, reason = "…")]`: the reason is stated
# where the lint is silenced, and a suppression that stops being needed fails
# the build instead of lingering.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# `.ok()` on a statement throws the error away without saying so.
unused_result_ok = "deny"
# JudgeError carries NonEmpty<Ambiguous>; boxing it buys nothing at this scale.
result_large_err = "allow"
# Counts physical lines, so rustfmt's line breaking decides it; the functions
# it flags are a CLI dispatcher, a loader and a few table-driven tests.
too_many_lines = "allow"
# Rust 1.99: wants `assert_eq!(x, [])` for `assert!(x.is_empty())`. Its fix
# needs a typed empty array (`[] as [String; 0]`) at most of the sites, all in
# tests, where a failing assertion is read from the test anyway.
assert_is_empty = "allow"

# Debug info dominates build time, link time and target/ size (hundreds of GB
# across the check worktree's and the working tree's builds). Line tables keep
# backtraces readable; dependencies carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
